schema_version: '1.0'
schema_type: node
node_id: cost-aware-model-router
title: 'Eval: Router enforces budget and escalation criteria to dynamically select the most cost-effective model/agent (logs
  decisions for Laya)'
type: capability
why: A request lands on an instant action, a fast model, or a full agent, and the choice is logged.
depends_on: []
acceptance_criteria:
- id: cost-aware-model-router-1
  criterion: A simple lookup ('Bring up the morning brief') stays under the minimum budget threshold and executes as an instant
    action.
- id: cost-aware-model-router-2
  criterion: A generative request ('What was the biggest news?') triggers the fast-model budget criteria and returns a cheap,
    fast answer.
- id: cost-aware-model-router-3
  criterion: A complex request ('Write me an explainer') hits the escalation criteria, routes to a full agent, and logs the
    decision for Laya's shadow training.
constraints:
- At most 6 grep calls and 15 read calls.
allowed_execution_modes:
- cursor_cli
required_artifacts: []
status: ready
priority: high
unlocks: []
