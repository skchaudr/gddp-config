      The work delivered:

      1. scripts/mine_agent_query_bank.py — a robust, read-only extractor that scans ~/.codex/sessions
      and ~/.pi/agent/sessions on both hosts, normalizes text, deduplicates, categorizes (knowledge/graphify_invocation/graphify_meta),
