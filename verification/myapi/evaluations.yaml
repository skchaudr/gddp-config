      2. evals/question-bank/question-bank-manifest.json — 3244 unique questions with full provenance
      (host, store, session_path, line_index, timestamp). No raw text leaks into tracked files.

      3. evals/question-bank/benchmark-receipt.md — human-readable summary with per-store counts, categories,
      and shape breakdown (356 benchmark, 2888 conversational).

      4. tests/test_question_bank.py — 14 unit/integration tests validating normalization, categorization,
      filters, and artifact consistency.

      5. .gitignore entries ensuring questions.jsonl and _scratch/ are never tracked.


      Every constraint is honored: read-only extraction (script only reads via filesystem/SSH cat), Pi/Codex-derived
      benchmark, raw transcript text gitignored, and Mini sessions integrated alongside Air (the 243 prior
      Mini questions are extended rather than discarded).


      The manifest and receipt are directly consumable by downstream nodes as required by the ''question-bank-produced''
      criterion. Graph integrity is clean: this node has no upstream dependencies (depends_on: []), and
      its outputs feed capture-live-vertex-baseline and prove-myapi-context-retrieval as stated.


      Two very minor observations (low severity): the local YAML copy lists allowed_execution_modes differently
      from the config, and actual session counts slightly exceed the original planning numbers — both
      are normal drift and do not threaten intent or graph integrity.'
