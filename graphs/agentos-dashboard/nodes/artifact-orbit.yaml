schema_version: '1.0'
schema_type: node
node_id: artifact-orbit
title: Mode A — artifact orbit ring with search/highlight filter and HUD card
type: capability
why: 'The signature interaction: a circular ring of generated-output nodes

  (html, excalidraw, pdf, markdown logs, code). Searching a client tag or

  category dims unrelated nodes and illuminates the linked cluster; clicking

  a node opens a floating HUD card (creation metadata, model, tags, path,

  Open File / Remove Ball / Close).

  '
depends_on:
- frontend-shell
acceptance_criteria:
- id: orbit
  criterion: Artifact orbit renders from graph.json (mock at first) as a ring of satellite
    nodes with parent-child glow relations.
- id: filter
  criterion: Fuzzy search/tag filter dims unrelated nodes and highlights the linked
    cluster per the plan.
- id: hud
  criterion: Clicking a node opens the HUD card with metadata, model, tags, and path;
    Open File / Remove Ball / Close behave per plan (Remove is a UI action, deletion
    of the file is explicitly out of scope unless Sab accepts it).
constraints:
- Remove Ball is UI-metadata removal only — never deletes the underlying file.
allowed_execution_modes:
- agent
- human
required_artifacts:
- orbit component + tests
status: pending
priority: high
unlocks:
- live-integration
