schema_version: "1.0"
schema_type: node
schema_version: '1.0'
schema_type: node
node_id: dogfood-dashboard
title: Dogfood the dashboard against Sab's real environment; polish pass
type: capability
why: "The dashboard's purpose is Sab's real environment \u2014 his vault(s), real\nartifacts, real routines. A dogfood session\
  \ exercises the whole surface\nwith real data and surfaces the polish list (density, performance,\nempty states) the plan\
  \ says to expect while building.\n"
depends_on:
- live-integration
acceptance_criteria:
- criterion: One real session runs the dashboard over Sabs environment with a recap: what rendered correctly, what broke
    (cited), what was polished.
  id: session
- criterion: The polish pass addresses density/readability/empty states per the plans theme and interaction specs; before/after
    cited.
  id: polish
- criterion: Session recap + screenshots/DOM evidence preserved as node evidence.
  id: evidence
constraints:
- "Polish within the charted scope \u2014 new capability ideas become proposals."
allowed_execution_modes:
- agent
- human
required_artifacts:
- dogfood session recap
status: pending
priority: medium
unlocks:
- rollout-plan
