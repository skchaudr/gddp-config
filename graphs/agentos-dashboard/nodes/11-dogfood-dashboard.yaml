schema_version: "1.0"
schema_type: node
node_id: dogfood-dashboard
title: Dogfood the dashboard against Sab's real environment; polish pass
type: capability
why: |
  The dashboard's purpose is Sab's real environment — his vault(s), real
  artifacts, real routines. A dogfood session exercises the whole surface
  with real data and surfaces the polish list (density, performance,
  empty states) the plan says to expect while building.
depends_on:
  - live-integration
acceptance_criteria:
  - id: session
    criterion: One real session runs the dashboard over Sab's environment with a
      recap: what rendered correctly, what broke (cited), what was polished.
  - id: polish
    criterion: The polish pass addresses density/readability/empty states per the
      plan's theme and interaction specs; before/after cited.
  - id: evidence
    criterion: Session recap + screenshots/DOM evidence preserved as node evidence.
constraints:
  - Polish within the charted scope — new capability ideas become proposals.
allowed_execution_modes:
  - pi
  - human
required_artifacts:
  - dogfood session recap
status: planned
priority: medium
unlocks:
  - rollout-plan
