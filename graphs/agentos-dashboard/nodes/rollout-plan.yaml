schema_version: '1.0'
schema_type: node
node_id: rollout-plan
title: Step-by-step debugging + iterative rollout plan
type: capability
why: 'The plan''s fourth deliverable: a step-by-step rollout plan for debugging

  and iterative enhancement — the bridge from working prototype to a

  dashboard Sab actually runs daily.

  '
depends_on:
- dogfood-dashboard
acceptance_criteria:
- id: rollout
  criterion: A rollout doc orders the debugging/iteration steps (from node 10/11 findings),
    each with owner, trigger, and exit evidence.
- id: ops
  criterion: The doc covers how the dashboard runs daily (start/stop, data sources,
    API, watcher) and what a regression looks like.
- id: gaps
  criterion: 'Post-dogfood gaps are classified (blocker vs polish) and each has a
    home: existing node, continuation proposal, or explicit out-of-scope.'
constraints:
- Plan/document only — no implementation in this node.
allowed_execution_modes:
- agent
- human
required_artifacts:
- rollout-plan.md
status: pending
priority: medium
unlocks: []
