schema_version: '1.0'
schema_type: node
node_id: data-topology-schema
title: "ARMS DAG schema \u2014 root router, domain hubs, leaf types, frontmatter contract, graph.json"
type: capability
why: "The whole dashboard renders one DAG. The schema fixes the data model:\nroot router note \u2192 domain hubs \u2192 leaf\
  \ nodes (skills, artifacts, routines,\napps/connectors), what frontmatter fields carry (title, tags, type,\ndates, model,\
  \ path), and the graph.json shape the watcher emits and the\nfrontend consumes.\n"
depends_on:
- scope-contract
acceptance_criteria:
- criterion: "A schema doc defines node types (root/hub/skill/artifact/routine/ app), required frontmatter fields, edge semantics\
    \ (router \u2192 leaf, parent \u2192 child), and the graph.json JSON schema."
  id: schema
- criterion: A sample graph.json generated from the real data sources listed in node 01 validates against the schema.
  id: sample
- criterion: The frontmatter contract is mechanically checkable (validator script or schema file), not prose-only.
  id: frontmatter
constraints:
- Schema + sample only; no watcher implementation (node 03).
allowed_execution_modes:
- agent
- human
required_artifacts:
- graph schema doc
- sample graph.json
status: pending
priority: high
unlocks:
- workspace-watcher
