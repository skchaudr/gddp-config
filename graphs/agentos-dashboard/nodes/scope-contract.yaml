title: Freeze plan scope, data sources, repo, and build posture
type: capability
why: "The plan (research/agentos-plan.md) is a spec derived from a video \u2014 rich\non UI/UX, open on data sources and repo.\
  \ Node 01 settles what the\ndashboard actually watches (which vaults, which artifact dirs, which\nroutines), where the app\
  \ lives, and confirms the stack so downstream\nnodes build against one contract.\n"
depends_on: []
acceptance_criteria:
- criterion: A scope doc names the data sources (vault roots incl. SSD, artifact directories, routine/cron sources) with exact
    paths, and the build repo location.
  id: scope
- criterion: Stack confirmed per plan (React + Vite + Tailwind + Canvas/D3, Node/Python watcher, REST/WS + SSE) or a cited
    deviation with rationale.
