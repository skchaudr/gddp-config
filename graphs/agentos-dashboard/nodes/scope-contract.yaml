schema_version: "1.0"
schema_type: node
node_id: scope-contract
title: Freeze plan scope, data sources, repo, and build posture
type: capability
why: |
  The plan (research/agentos-plan.md) is a spec derived from a video — rich
  on UI/UX, open on data sources and repo. Node 01 settles what the
  dashboard actually watches (which vaults, which artifact dirs, which
  routines), where the app lives, and confirms the stack so downstream
  nodes build against one contract.
depends_on: []
acceptance_criteria:
  - id: scope
    criterion: A scope doc names the data sources (vault roots incl. SSD,
      artifact directories, routine/cron sources) with exact paths, and the
      build repo location.
  - id: stack
    criterion: Stack confirmed per plan (React + Vite + Tailwind + Canvas/D3,
      Node/Python watcher, REST/WS + SSE) or a cited deviation with rationale.
  - id: posture
    criterion: The "learn while building" posture is stated: mock-first where
      the plan is thin, evidence-gated where it is concrete.
constraints:
  - Contract/spec node — no implementation in this node.
allowed_execution_modes:
  - pi
  - human
required_artifacts:
  - research/agentos-plan.md
status: complete
priority: high
unlocks:
  - data-topology-schema
  - frontend-shell
