schema_version: "1.0"
schema_type: node
node_id: frontend-shell
title: React + Vite + Tailwind app shell — theme, layout, routing
type: capability
why: |
  The plan specifies a standalone web app: deep obsidian theme (#0c0d10),
  amber/neon accents (#ff6b35, #f59e0b, #38bdf8), center canvas with the
  two modes, and perimeter widgets (top search, left launcher + clock,
  right digest + skills deck + routines board). The shell carries all of it.
depends_on:
  - scope-contract
acceptance_criteria:
  - id: shell
    criterion: React + Vite + Tailwind app runs with the plan's theme tokens and
      the center-canvas + perimeter-panel layout; routing/mode switching works.
  - id: perimeter
    criterion: Perimeter widgets render as placeholders wired to their future
      data (search bar, launcher, clock, digest, skills deck slot, routines slot).
  - id: build
    criterion: Production build passes; app serves locally with no console errors.
constraints:
  - Shell/layout only; component behaviors land in nodes 05-08.
allowed_execution_modes:
  - pi
  - human
required_artifacts:
  - app repo
  - theme tokens
status: planned
priority: high
unlocks:
  - artifact-orbit
  - radial-dag
  - skills-deck
  - routines-board
