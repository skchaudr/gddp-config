schema_version: "1.0"
schema_type: node
schema_version: '1.0'
schema_type: node
node_id: backend-api
title: "Backend API \u2014 /api/skills/run + SSE/WebSocket live logs"
type: capability
why: 'The plan requires the backend: expose /api/skills/run executing headless

  commands (claude -p or the executor settled in node 01), and pipe live

  output logs to the UI via SSE or WebSocket. This is the seam the skills

  deck and routines board consume.

  '
depends_on:
- skills-deck
- routines-board
acceptance_criteria:
- criterion: /api/skills/run executes the named skill via the declared executor with the requested model/effort, returning
    run metadata + run id.
  id: run-endpoint
- criterion: Live output streams to the UI over SSE or WebSocket; stream closes cleanly with exit status.
  id: streaming
- criterion: "The endpoint validates skill names against the declared skills set \u2014 no arbitrary command injection via\
    \ the API."
  id: safe
constraints:
- "Backend only \u2014 executor identity is per node 01 scope; no UI here."
allowed_execution_modes:
- agent
- human
required_artifacts:
- API server + route tests
status: pending
priority: high
unlocks:
- live-integration
