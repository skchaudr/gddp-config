schema_version: '1.0'
schema_type: node
node_id: backend-api
title: Backend API — /api/skills/run + SSE/WebSocket live logs
type: capability
why: 'The plan requires the backend: expose /api/skills/run executing headless

  commands (claude -p or the executor settled in node 01), and pipe live

  output logs to the UI via SSE or WebSocket. This is the seam the skills

  deck and routines board consume.

  '
depends_on:
- skills-deck
- routines-board
acceptance_criteria:
- id: run-endpoint
  criterion: /api/skills/run executes the named skill via the declared executor with
    the requested model/effort, returning run metadata + run id.
- id: streaming
  criterion: Live output streams to the UI over SSE or WebSocket; stream closes cleanly
    with exit status.
- id: safe
  criterion: The endpoint validates skill names against the declared skills set —
    no arbitrary command injection via the API.
constraints:
- Backend only — executor identity is per node 01 scope; no UI here.
allowed_execution_modes:
- agent
- human
required_artifacts:
- API server + route tests
status: pending
priority: high
unlocks:
- live-integration
