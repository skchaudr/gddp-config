schema_version: '1.0'
schema_type: project_graph
project_id: agentos-dashboard
project_name: AgentOS Dashboard — LifeOS web command center
description: >-
  Build the AgentOS/LifeOS Dashboard per Sab's plan (research/agentos-plan.md,
  from the Rubric Agentic OS video breakdown): a standalone web command
  center — React + Vite + Tailwind + Canvas/D3 — with an artifact orbit
  ring, a radial second-brain DAG, a headless skills deck, and a routines
  board, backed by a workspace watcher that parses router markdown +
  frontmatter into a graph.json and a /api/skills/run endpoint with live
  SSE/WebSocket logs.
repo: local (new app; repo location settled in node 01)
blueprint:
  vision: >-
    A production-ready interactive command center over Sab's real
    environment — vaults (SSD), artifacts, routines, agents — learned while
    building. The plan is a spec derived from a video; the graph turns it
    into bounded deliverables with evidence: schema, watcher, shell, orbit,
    DAG, skills deck, routines board, API, live integration, dogfood,
    rollout.
  architecture_notes: >-
    Settled during charting (2026-08-23, plan source:
    sab-air /Users/sab-mini/Obsidian/SSD/00 Inbox/AgentOS Dashboard -
    LifeOS Dashboard.md): Two center modes — Mode A artifact orbit (ring of
    generated outputs, search/highlight filter, click-to-HUD with
    metadata/path/Open/Remove/Close) and Mode B radial DAG (root router →
    domain hubs → leaf skills/artifacts/routines/apps; force/circle/hex/
    concentric layouts, physics sliders). Perimeter widgets: top fuzzy
    search, left micro-apps launcher + clock, right email digest + skills
    deck (model + effort selectors, headless claude -p execution) +
    routines firing board (next/queued/fired, local vs cloud worker, sync).
    Backend: Node/Python watcher daemon → graph.json from router markdown +
    YAML/JSON frontmatter; /api/skills/run; SSE/WebSocket log piping.
    Theme #0c0d10 with #ff6b35/#f59e0b/#38bdf8 accents. Charted as
    12 capability nodes; "expect the rest to be learned while building"
    lives inside nodes, not in the chart. Data sources (which vaults, which
    artifact dirs, which routines) are settled in node 01, not assumed.
  major_capabilities:
    - artifact orbit with search filter + HUD inspection
    - radial DAG with 4 layouts + physics controls
    - headless skills deck (model/effort selectors)
    - routines board with sync status
    - workspace watcher → graph.json
    - /api/skills/run + live log streaming
    - live integration, dogfood, rollout plan
graph_version: '1.0'
