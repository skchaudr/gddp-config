blueprint:
  vision: 'Audit five areas of the Pi harness with evidence-cited findings, then execute
    the accepted proposals of each audit: subagents reliability, TUI/interactive performance,
    extensions friction, agent instructions/memory/docs, repo-as-portfolio.'
  architecture_notes: 'Five independent pairs. Each execution node depends only on
    its own audit. factory_mission engagement, one pair per engagement. Node sizing:
    one ~100k-token session of work per node.'
  major_capabilities:
  - subagent orchestration reliability and traceability
  - interactive/TUI performance under load
  - extensions and hooks friction reduction
  - agent instructions and memory hygiene
  - repo portfolio readiness
