schema_version: '1.0'
schema_type: node
node_id: skill-backbone-automation
title: 'Goal: Convert at least one manual conversational workflow into an automated, headless skill'
type: capability
why: One documented workflow runs headlessly twice.
depends_on:
- memory-layer-discipline
acceptance_criteria:
- id: skill-backbone-automation-1
  criterion: One recurring workflow (a presence brief over social accounts, Taskdog, and daily notes) is documented so a human
    could follow it manually.
- id: skill-backbone-automation-2
  criterion: That same skill runs headlessly and writes its finished deliverable to the agent destination the existing map
    already names.
- id: skill-backbone-automation-3
  criterion: Running the skill a second time produces a new deliverable without requiring any code rewrites to the skill.
constraints:
- At most 6 grep calls and 15 read calls.
allowed_execution_modes:
- cursor_cli
required_artifacts: []
status: pending
priority: high
unlocks:
- visual-layer-consolidation
