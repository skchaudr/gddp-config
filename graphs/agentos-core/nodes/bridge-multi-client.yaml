schema_version: '1.0'
schema_type: node
node_id: bridge-multi-client
title: 'Eval: Bridge accepts requests from multiple interfaces (Obsidian, Taskdog, Zed, Terminal)'
type: capability
why: One bridge records the same request from more than one client.
depends_on: []
acceptance_criteria:
- id: bridge-multi-client-1
  criterion: A request sent from Obsidian is recorded once by the bridge.
- id: bridge-multi-client-2
  criterion: The same request sent from a second client (Zed, Taskdog, or the terminal) is recorded by that same bridge.
- id: bridge-multi-client-3
  criterion: Both submissions are routed to the same outcome.
constraints:
- At most 6 grep calls and 15 read calls.
allowed_execution_modes:
- cursor_cli
required_artifacts: []
status: ready
priority: high
unlocks: []
