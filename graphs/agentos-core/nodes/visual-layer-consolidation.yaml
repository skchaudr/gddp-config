schema_version: '1.0'
schema_type: node
node_id: visual-layer-consolidation
title: 'Goal: The shared interface displays deliverables (metrics, schedules) driven by the headless skills'
type: capability
why: The skill deliverable is visible on a display without opening the background run.
depends_on:
- skill-backbone-automation
acceptance_criteria:
- id: visual-layer-consolidation-1
  criterion: The presence-brief deliverable is visible on Obsidian or a lean desktop app without opening the background run.
- id: visual-layer-consolidation-2
  criterion: The metrics inside the deliverable, including social accounts and GitHub commits, are fully rendered and visible.
- id: visual-layer-consolidation-3
  criterion: Asking a question about the deliverable from that display reads the persistent copy the skill wrote.
constraints:
- At most 6 grep calls and 15 read calls.
allowed_execution_modes:
- cursor_cli
required_artifacts: []
status: pending
priority: high
unlocks: []
