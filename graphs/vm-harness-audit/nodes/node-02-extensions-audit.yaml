schema_version: "1.0"
schema_type: node

node_id: node-02-extensions-audit
title: Audit pi extension surface on the VM
type: capability

why: Extensions are where pi bugs concentrate (the xAI/grok OAuth freeze is the standing precedent). A known-good inventory of the VM's extension surface is required before the VM hosts real workloads.

depends_on:
  - node-01-entrypoints-audit

acceptance_criteria:
  - id: report-exists
    criterion: reports/02-extensions.md exists and is non-empty
  - id: extensions-enumerated
    criterion: report enumerates installed pi extensions (agent extensions directory, npm-installed extensions, and config-enabled entries) with enabled/disabled state where discoverable
  - id: suspects-flagged
    criterion: report explicitly flags known-bug suspect extensions (grok/xAI OAuth flow) and any extension missing a loadable entrypoint
  - id: integration-points-noted
    criterion: report notes droid-adjacent integration points (extensions or config that touch droid, factory, or executor dispatch)

constraints:
  - "Read-only: inspect and report only"
  - Do not load or execute extension code beyond reading manifests and config

allowed_execution_modes:
  - droid

required_artifacts:
  - reports/02-extensions.md

status: pending
priority: medium

unlocks:
  - node-03-subagents-chains-audit
