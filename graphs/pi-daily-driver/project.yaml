schema_version: '1.0'
schema_type: project_graph
project_id: pi-daily-driver
project_name: Pi Daily Driver — curated extensions + skills port
description: >-
  Cleanly port Pi extensions and the (misnamed) "dsh plugins" concern into a
  daily driver: freeze the inventory, classify tiers, decide what dsh
  actually is, package the interactive set as one installable pi package,
  define the enable-set policy, name the Hermes twin adapters, compose the
  mux stack without double-binding, curate the skill allowlist, write the
  aa-cli boundary, then dogfood on sab-mini.
repo: local (~/.pi/agent; aa-cli boundary via skchaudr/aa-cli)
blueprint:
  vision: >-
    One installable, curated Pi environment Sab runs daily: interactive
    extensions + skills selected and documented, harness-only machinery kept
    out, Hermes/aa-cli boundaries explicit, and the whole thing proven by a
    real dogfood session. Port means curate/package, not rewrite three
    plugin APIs.
  architecture_notes: >-
    Settled during charting (2026-08-23, grok-4.6 scout report 44c089b0):
    Pi discovers packages (npm/git/path) + loose TS extensions
    (~/.pi/agent/extensions) + skills (~/.pi/agent/skills, ~/.agents/skills).
    Hermes is a separate Python plugin.yaml world with overlapping behaviors
    (noise-trim, herdr, moshi) — one capability, two adapters. aa-cli is the
    operator TUI (Rust+zsh, targets.conf) and is NOT a Pi extension surface.
    dsh has no binary/plugin format — only an executor label (deepseek
    harness) in aa-cli verify docs; its definition is a human decision node
    here. Providers (clinepass/antigravity/mercury) stay optional installs.
    Cleanest seam: one `pi` package + capability catalog. The dsh decision
    and the Telegram boundary question (USER.md) are charted as decision
    nodes, resolved by Sab during acceptance.
  major_capabilities:
    - checked-in extension/skill catalog with tiers
    - one installable daily-driver pi package
    - enable-set policy diff (not applied until human accept)
    - Hermes twin adapters named, not merged
    - mux stack conflict matrix + load order
    - aa-cli / Pi boundary written
    - dogfood proof on sab-mini
graph_version: '1.0'
