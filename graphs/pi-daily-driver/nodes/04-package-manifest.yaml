schema_version: "1.0"
schema_type: node
node_id: package-manifest
title: One installable daily-driver pi package
type: capability
why: |
  The cleanest unification seam: one `pi` package (daily-driver) that selects
  and documents the interactive extension+skill set, installable via pi
  install and visible in pi list.
depends_on:
  - classify-extension-tiers
  - dsh-definition-decision
acceptance_criteria:
  - id: package-json
    criterion: A package.json `pi` key exists listing the interactive-core
      extensions + skills, resolvable as an installable path package.
  - id: installable
    criterion: pi install succeeds on a staging copy; pi list shows the package.
  - id: scoped
    criterion: Package contains interactive-core only — no harness-only, no
      providers (those stay optional installs documented separately).
constraints:
  - Package authored and staged; not yet applied to sab-mini's live settings.
allowed_execution_modes:
  - pi
  - human
required_artifacts:
  - package.json
  - settings.json (staging)
status: planned
priority: high
unlocks:
  - enable-set-policy
  - dogfood-session
