schema_version: "1.0"
schema_type: node
node_id: adapter-twins
title: One capability, two adapters — noise-trim / herdr / moshi twins
type: capability
why: |
  Policy twins already dual-home: answer-noise-trim, herdr-agent-state,
  moshi-hooks exist as Pi TS + Hermes Python with one behavior. The daily
  driver treats each as one capability with two adapters — never a third
  runtime, never a merged plugin API.
depends_on:
  - inventory-extension-catalog
acceptance_criteria:
  - id: twin-contract
    criterion: A one-page contract per twin capability: shared behavior, Pi
      adapter path, Hermes adapter path, file map, and the behavior-integrity
      check that keeps them in sync.
  - id: no-third-runtime
    criterion: The spec states no new runtime/plugin file format is introduced
      for twins.
  - id: coverage
    criterion: noise-trim, herdr-agent-state, moshi-hooks are all mapped; any
      additional twin found in cataloging is added with a row.
constraints:
  - Spec/documentation only — no behavior changes in this node.
allowed_execution_modes:
  - pi
  - human
required_artifacts:
  - ~/.pi/agent/extensions/
  - ~/.hermes/plugins/
status: planned
priority: medium
unlocks:
  - dogfood-session
