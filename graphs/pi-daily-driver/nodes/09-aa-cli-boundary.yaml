schema_version: "1.0"
schema_type: node
node_id: aa-cli-boundary
title: Written seam — aa-cli stays the fire/verify TUI, Pi stays the harness
type: capability
why: |
  The port's biggest over-reach risk is wrapping aa-cli as a Pi extension or
  porting verify rooms into Pi. aa-cli is a Rust+zsh operator TUI with
  targets.conf; Pi is the coding harness. The boundary is written so the
  daily driver never absorbs it.
depends_on:
  - inventory-extension-catalog
acceptance_criteria:
  - id: seam-doc
    criterion: A decision doc states aa-cli remains the fire/verify TUI, Pi
      remains the coding harness, and no verify-room or deck port crosses the
      boundary, citing LOOP.md / GDDP-becomes-small-and-real.md intent.
  - id: interface
    criterion: The only sanctioned cross-points are named (e.g. dispatch targets,
      receipts), with any existing ad-hoc cross-points listed for removal.
  - id: graph-scope
    criterion: MAP.md notes the aa-cli TUI pass is charted separately
      (aa-cli-tui-pass) and this graph contains no aa-cli implementation nodes.
constraints:
  - Written boundary only; no changes to aa-cli or Pi in this node.
allowed_execution_modes:
  - pi
  - human
required_artifacts:
  - /Users/sab-mini/repos/aa-cli/gddp/CANONICAL.md
  - /Users/sab-mini/repos/gddp-runtime/docs/GDDP-becomes-small-and-real.md
status: planned
priority: high
unlocks:
  - dogfood-session
