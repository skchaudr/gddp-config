schema_version: "1.0"
schema_type: node
node_id: dsh-definition-decision
title: Human decision — what is dsh?
type: decision
why: |
  Sab asked for a port of "Pi extensions and dsh plugins". Scout evidence:
  dsh has no binary, no repo, no plugin format. Only durable hits are an
  author label ("dsh architecture pass 1 of 3 (deepseek-harness)" in
  aa-cli/docs/verify-pathway-architecture.md) and packet target: dsh on
  verify slices 02-06 — absent from targets.conf. The port graph's scope
  depends on what dsh turns out to be.
depends_on:
  - inventory-extension-catalog
acceptance_criteria:
  - id: decision-recorded
    criterion: resolution names what dsh is (deepseek-harness executor label vs a
      plugin product vs speech mix-up with Hermes plugins / Pi packages) with rationale.
  - id: scope-effect
    criterion: The decision states whether the graph keeps a dsh surface; if it's
      an executor label only, "dsh plugins" is dropped from this graph's scope and
      MAP.md updated.
constraints:
  - Human decision — no executor may resolve it. Evidence cites scout report.
allowed_execution_modes:
  - human
required_artifacts:
  - aa-cli/docs/verify-pathway-architecture.md
  - aa-cli/targets.conf
status: planned
priority: high
unlocks:
  - package-manifest
