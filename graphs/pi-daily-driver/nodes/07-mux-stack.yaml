schema_version: "1.0"
schema_type: node
node_id: mux-stack
title: Compose the session-coordination stack without double-binding
type: capability
why: |
  pi-subagents + pi-intercom + pi-boss/pi-room + herdr mux already form the
  "rooms" stack, but nothing documents which loads when and which slash
  commands bind where. Double-bound commands are a real daily-driver hazard.
depends_on:
  - inventory-extension-catalog
acceptance_criteria:
  - id: conflict-matrix
    criterion: A matrix lists every coordination surface (subagents, intercom,
      boss/room, herdr) with its commands and highlights any double-bound slash
      commands.
  - id: load-order
    criterion: Recommended enable/load order is documented with rationale.
  - id: recommendation
    criterion: Any binding conflict gets a resolution recommendation for Sab's
      accept (not silently changed).
constraints:
  - Documentation/conflict analysis only; no config changes in this node.
allowed_execution_modes:
  - pi
  - human
required_artifacts:
  - ~/.pi/agent/settings.json
  - ~/.pi/agent/npm/node_modules/pi-subagents/
  - ~/.pi/agent/npm/node_modules/pi-intercom/
status: planned
priority: medium
unlocks:
  - dogfood-session
