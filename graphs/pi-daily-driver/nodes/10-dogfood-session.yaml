schema_version: "1.0"
schema_type: node
node_id: dogfood-session
title: Install the package on sab-mini, /reload, run one real session
type: capability
why: |
  The graph's proof: the daily driver actually works on the machine it's for.
  A real session exercises the curated set end to end and surfaces broken
  commands before Sab depends on it daily.
depends_on:
  - package-manifest
  - enable-set-policy
  - adapter-twins
  - mux-stack
  - skill-curation
  - aa-cli-boundary
acceptance_criteria:
  - id: installed
    criterion: The daily-driver package installs on sab-mini and pi list shows it.
  - id: reloaded
    criterion: /reload completes; extension load errors (if any) are listed with
      exact package names.
  - id: session-recap
    criterion: One real working session runs in the daily driver with a recap of
      what worked, what broke (broken commands cited to their package), and what
      was reverted.
  - id: mux-clean
    criterion: No double-bound slash commands fired unexpectedly during the session.
constraints:
  - Applied changes follow the enable-set policy diff Sab accepted; anything
    else is reverted, not left half-installed.
allowed_execution_modes:
  - pi
  - human
required_artifacts:
  - ~/.pi/agent/settings.json
  - session recap
status: planned
priority: high
unlocks: []
