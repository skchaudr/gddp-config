schema_version: "1.0"
schema_type: node

node_id: milestone-06-single-refresh-entrypoint
title: Refresh the whole projection from one restartable entrypoint
type: milestone

why: "After milestone-02 the hub has three ingestion sources — pi's own observability streams, GDDP verdict receipts under gddp-config verification, and the executor event spools under gddp-runtime jobs — each landed by a different node with its own invocation. An observability tool nobody can refresh in one command is a tool that goes stale, and a stale trace view is worse than none because it looks current. The existing pi-hub.db has not been written since 2026-08-06, which is exactly this failure already happening. This node makes refresh one documented, restartable call with per-source failure isolation, so one unreadable receipt or one truncated events.jsonl cannot take down the whole refresh. It deliberately stops short of scheduling: the mini-heartbeat kit and launchd surfaces are frozen infrastructure, and wiring a timer is a separate decision the operator makes once the entrypoint has proven itself by hand."

depends_on:
  - milestone-02-executor-event-projection

acceptance_criteria:
  - id: one-entrypoint
    criterion: "one documented command refreshes all three sources in a stated order, and the report shows a single invocation producing per-source row counts"
  - id: per-source-failure-isolation
    criterion: "a deliberately broken source — an unparseable receipt or a truncated events.jsonl — is shown failing without aborting the other sources; the report captures the run, the reported per-source error, and the counts the healthy sources still produced"
  - id: machine-readable-run-summary
    criterion: "each invocation records a run summary row capturing start, end, per-source counts, and per-source outcome, and the report shows two consecutive summaries and the exit codes for a clean run and a partial-failure run"
  - id: safe-alongside-a-serving-reader
    criterion: "a refresh completes while a reader surface is serving the same database; the report shows the concurrent run, the WAL and busy_timeout settings that make it safe, and confirms the reader saw no error"
  - id: restartable
    criterion: "an interrupted refresh leaves the database consistent and the next invocation completes the work; the report shows the interruption method, a post-interruption integrity check, and the completing run"
  - id: no-scheduler-installed
    criterion: "the report confirms no launchd job, cron entry, timer, or heartbeat hook was created or modified, and gives the manual invocation the operator should use"
  - id: report-exists
    criterion: "reports/pi-hub-projection/milestone-06-single-refresh-entrypoint.md exists with the invocation, the source order, and the isolation, concurrency, and restart evidence"

constraints:
  - Create and modify files only inside /Users/sab-mini/.pi
  - Install no scheduler of any kind — no launchd plist, no cron entry, no timer, no heartbeat hook; this node delivers the entrypoint and its evidence only
  - Do not read, modify, or invoke anything under /Users/sab-mini/repos/gddp-runtime/deploy/mini-heartbeat/; that surface is frozen
  - Read the gddp-config and gddp-runtime sources in place and read-only; never write into either repo and never invoke the gddp CLI or scripts/jobs_status.py
  - Reuse the ingestion code the earlier milestones landed; this node orchestrates and hardens, it does not reimplement any source ingester
  - python3 stdlib only; no new dependencies
  - A partial failure must exit non-zero and name the failed source; never exit zero on a partially failed refresh
  - Never run git add -A; stage only files this node created or changed
  - Commit all work on this node's result ref per the executor contract

allowed_execution_modes:
  - droid

required_artifacts:
  - reports/pi-hub-projection/milestone-06-single-refresh-entrypoint.md

status: pending
priority: medium

unlocks: []
