schema_version: '1.0'
schema_type: project_graph
project_id: aa-cli-verify
project_name: AA CLI — Verify Pathway
description: >-
  Chart the open decisions on aa-cli's verify pathway — the product's
  load-bearing core — from a deck-dispatched packet (or an ad-hoc
  user-supplied subject) to a task officially marked verified, visually and
  schema-wise, reflected in the deck and past tasks.
repo: skchaudr/aa-cli
blueprint:
  vision: >-
    The way to "verified" is fully charted: every open decision on the verify
    pathway resolved, so this graph can graduate into a dispatchable execution
    DAG. Verify runs from a deck-dispatched packet (or an ad-hoc user-supplied
    subject via generic verify) through evidence capture to a human-flipped
    verified mark (✓✓) reflected in the deck and past tasks.
  architecture_notes: >-
    Settled during charting (2026-08-06): verify is a 3-option menu (one-shot
    agent verify/recon/audit with template + optional skill + optional custom
    instructions; nvim/fzf; git panel). State language: white ✓
    machine-returned, green ✓ agent-good, red ✓ agent-disagrees with viewable
    reason, ✓✓ human-accepts-only. The verified mark is `verified:
    completion|review` on the JSON packet (run-level); deck and past tasks
    derive. zsh backend, Rust frontend. Async pull/apply is a precondition;
    verify judges the workdir as it stands, target-agnostic.
  major_capabilities: []
graph_version: '1.0'
created_at: '2026-08-06'
last_updated: '2026-08-06'
