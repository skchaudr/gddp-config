schema_version: "1.0"
schema_type: node
node_id: async-verify-composition
title: How does verify compose with async targets?
type: capability
why: |
  Async targets (jules/codex/pi) return remotely and land via pull/apply;
  whether verify absorbs that intake or judges after it shapes the whole
  menu's scope. Settled during charting on 2026-08-06.
depends_on: []
acceptance_criteria:
  - id: decision-recorded
    criterion: resolution field names the chosen option and its rationale
  - id: map-updated
    criterion: dependent nodes are wired and MAP.md is current
constraints:
  - Decision only — no implementation in this node
allowed_execution_modes:
  - human
required_artifacts: []
status: ready
priority: medium
unlocks: []
resolution: |
  2026-08-06 (charting, Sab): Precondition, not absorption. For async targets
  you pull/apply first via the existing machinery (aa jules pull/diff/apply,
  reconcile); then the verify menu — agent verdict, nvim/fzf, git panel —
  inspects the applied result. Verify judges the workdir as it stands and
  stays target-agnostic. Anything more becomes overskill and expands verify's
  scope.
