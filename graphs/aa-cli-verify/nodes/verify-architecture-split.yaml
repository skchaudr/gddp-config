schema_version: "1.0"
schema_type: node
node_id: verify-architecture-split
title: Where does verify live architecturally?
type: capability
why: |
  aa-cli has two runtimes (zsh lib, Rust hub) with documented divergence;
  pinning which side owns verify prevents the drift from reproducing inside
  this map's build. Settled during charting on 2026-08-06.
depends_on: []
acceptance_criteria:
  - id: decision-recorded
    criterion: resolution field names the chosen option and its rationale
  - id: map-updated
    criterion: dependent nodes are wired and MAP.md is current
constraints:
  - Decision only — no implementation in this node
allowed_execution_modes:
  - human
required_artifacts: []
status: ready
priority: medium
unlocks: []
resolution: |
  2026-08-06 (charting, Sab): zsh backend, Rust frontend. State mutation
  lives in the zsh lib (lib/validate.zsh runs verify commands, flips packet
  fields, transitions the ledger); the Rust TUI (hub-rs verify screen)
  renders contract + evidence and delegates to `aa verify <id>`. Fact-check:
  this split is already true and clean in code — recorded here as a standing
  constraint on all build nodes that follow.
