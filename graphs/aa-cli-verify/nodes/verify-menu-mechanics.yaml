schema_version: "1.0"
schema_type: node
node_id: verify-menu-mechanics
title: What is the verify pathway's mechanics?
type: capability
why: |
  The verify pathway is the product-side load-bearing core of aa-cli; its
  mechanics decision defines what the user actually does at the verify
  moment. Settled during charting on 2026-08-06.
depends_on: []
acceptance_criteria:
  - id: decision-recorded
    criterion: resolution field names the chosen option and its rationale
  - id: map-updated
    criterion: dependent nodes are wired and MAP.md is current
constraints:
  - Decision only — no implementation in this node
allowed_execution_modes:
  - human
required_artifacts: []
status: ready
priority: high
unlocks:
  - verify-menu-subtree
  - verifier-agent-contract
  - generic-verify-entry
resolution: |
  2026-08-16 (charting, Sab): REVISED from the 3-option menu. Verify uses the
  same 3-room grammar as create; Tab swaps the whole working surface and the
  packet/contract strip stays visible the whole time. Rooms: (1) Evidence
  (front) — what happened: artifacts + nvim/fzf + git live inside it as
  tools/panes (create's workdir room, inverted). (2) Agent — one-shot
  verify/recon/audit; template + skill + custom instructions via pickers, no
  standing roster. (3) Contract — the packet body being judged (create's
  prompts room, inverted). Git is a tool inside Evidence, not a third room.
  Today's e g/s/d/l ; become picker-surfaced, previewed actions inside the
  rooms, not a 9-key bar. Placement: verify screen, never deck detail.
