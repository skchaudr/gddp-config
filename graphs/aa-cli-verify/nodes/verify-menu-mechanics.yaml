schema_version: "1.0"
schema_type: node
node_id: verify-menu-mechanics
title: What is the verify pathway's mechanics?
type: capability
why: |
  The verify pathway is the product-side load-bearing core of aa-cli; its
  mechanics decision defines what the user actually does at the verify
  moment. Settled during charting on 2026-08-06.
depends_on: []
acceptance_criteria:
  - id: decision-recorded
    criterion: resolution field names the chosen option and its rationale
  - id: map-updated
    criterion: dependent nodes are wired and MAP.md is current
constraints:
  - Decision only — no implementation in this node
allowed_execution_modes:
  - human
required_artifacts: []
status: ready
priority: high
unlocks:
  - verify-menu-subtree
  - verifier-agent-contract
  - generic-verify-entry
resolution: |
  2026-08-06 (charting, Sab): Verify is a 3-option menu that breaks into
  sub-options. (1) Dispatch a one-shot agent to 'verify' or 'recon/audit' the
  work done — prompt template attached as per the task dispatch, a skill
  attached if needed, and optional custom instructions tacked on. (2) A
  neovim/fzf option. (3) A git panel for git options. Generic verify mode (no
  packet attached — the user supplies their own feature/task/area/prior work)
  is the same machinery minus the packet. Fact-check: the verify screen today
  has `e` (agent picker), `g/s/d/l` (git cluster), `;` (fzf hub); the trio
  menu, a custom-instructions field, and a dedicated nvim option are build
  targets, not yet present.
