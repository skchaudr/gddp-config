schema_version: "1.0"
schema_type: node
node_id: verify-menu-subtree
title: What is the verify menu's exact sub-option tree, and where does it live?
type: capability
why: |
  The 3-option menu is settled (see "What is the verify pathway's
  mechanics?"), but its sub-option tree — agent: verb choice, template
  attach, skill attach, custom instructions; nvim/fzf: what gets picked or
  opened; git panel: which commands — and its placement (verify screen
  submenu vs deck detail) are undecided. Every build node hangs on this
  shape.
depends_on:
  - verify-menu-mechanics
acceptance_criteria:
  - id: decision-recorded
    criterion: resolution field names the full sub-option tree and the menu's placement
  - id: existing-surface-respected
    criterion: resolution states how the menu relates to today's e, g/s/d/l, and semicolon keys on the verify screen
  - id: map-updated
    criterion: fog graduated into new nodes and affected nodes amended
constraints:
  - Decision only — no implementation in this node
  - Respect the zsh-backend/Rust-frontend split — the menu renders in Rust, actions delegate to zsh
allowed_execution_modes:
  - human
required_artifacts: []
status: pending
priority: high
unlocks: []
resolution: ""
