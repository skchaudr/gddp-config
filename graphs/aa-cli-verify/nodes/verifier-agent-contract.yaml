schema_version: "1.0"
schema_type: node
node_id: verifier-agent-contract
title: What does the one-shot verifier agent return, and how is it dispatched?
type: capability
why: |
  The agent verdict drives the green ✓ and red ✓ marks. The verdict schema
  (pass/disagree plus a stated reason), where the reason is stored and how
  the human views it, which targets may run a verifier, and how
  template/skill/custom-instruction attach flows through dispatch are all
  undefined.
depends_on:
  - verify-menu-mechanics
acceptance_criteria:
  - id: decision-recorded
    criterion: resolution field names the chosen option and its rationale
  - id: verdict-schema-named
    criterion: resolution names the verdict fields, including the stated reason for disagreement
  - id: reason-viewable
    criterion: resolution states where the reason lives and how the human views it
  - id: attach-flow-named
    criterion: resolution states how template, skill, and custom instructions reach the verifier dispatch
  - id: map-updated
    criterion: fog graduated into new nodes and affected nodes amended
constraints:
  - Decision only — no implementation in this node
  - The agent never sets ✓✓ — acceptance is human-only
allowed_execution_modes:
  - human
required_artifacts: []
status: pending
priority: high
unlocks:
  - verify-evidence-surface
resolution: ""
