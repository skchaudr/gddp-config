node_id: generic-verify-entry
title: How does the user enter generic verify mode without a packet?
type: capability
why: |
  Generic verify is settled as the same 3-option machinery minus the packet
  (see "What is the verify pathway's mechanics?"), but the entry point is
  undecided: how the user supplies a subject — freeform text, picking a
  directory or area, selecting prior work — and from which surface.
depends_on:
  - verify-menu-mechanics
