    criterion: resolution field names the chosen option and its rationale
  - id: entry-flow-named
    criterion: resolution describes the entry flow from intent to the 3-option menu, including what stands in for the packet
  - id: map-updated
    criterion: fog graduated into new nodes and affected nodes amended
constraints:
  - Decision only — no implementation in this node
allowed_execution_modes:
  - human
