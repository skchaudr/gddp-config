schema_version: "1.0"
schema_type: node
node_id: past-tasks-reflection
title: How do the four verify states render and filter in the deck and past tasks?
type: capability
why: |
  The destination requires verified status reflected in the deck and past
  tasks. Glyph rendering in list views, filtering/sorting by state, and the
  evergreen-card-vs-run-state display question are undecided. Blocked on the
  state model and its schema location (both settled at charting; flips
  pending).
depends_on:
  - verify-state-model
  - verified-state-location
acceptance_criteria:
  - id: decision-recorded
    criterion: resolution field names the chosen option and its rationale
  - id: render-rules-named
    criterion: resolution states how white ✓, green ✓, red ✓, and ✓✓ render in deck list, deck detail, and past tasks
  - id: evergreen-rule-named
    criterion: resolution states what an evergreen card shows when its latest run differs from earlier runs
  - id: map-updated
    criterion: fog graduated into new nodes and affected nodes amended
constraints:
  - Decision only — no implementation in this node
allowed_execution_modes:
  - human
required_artifacts: []
status: pending
priority: medium
unlocks: []
resolution: |
  2026-08-16 (charting, Sab): Past tasks = the daily archive
  tasksCompleted/<date>/: one folder per day, born on the first packet of the
  day; holds the day's packets + one append-only review.log (a line per
  review, reason only on disagree), newest first, same path every time. The
  deck is active/pending work only: green ✓ (agent pass) and red ✓ (agent
  disagree) both STAY in the deck until the human ✓✓; only ✓✓ releases a
  packet to the archive.
