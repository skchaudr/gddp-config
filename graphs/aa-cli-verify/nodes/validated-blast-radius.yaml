title: What is the blast radius of the validated-to-verified state-model migration?
type: capability
why: |
  The future execution graph needs every read/write site of `validated`,
  `done`, and the glyph logic across zsh, Rust, and the packet schema
  inventoried before the state-model migration (see "What are the official
  verify states, and who sets them?") can be sliced into build nodes.
