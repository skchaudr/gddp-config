schema_version: "1.0"
schema_type: node
node_id: verify-evidence-surface
title: What does the human see at the review moment, and how does the accept flow work?
type: capability
why: |
  The human ✓✓ flip needs a designed surface: which evidence is shown
  (output tail, git diff, validation.json, agent verdict with its stated
  reason) and how the accept action flows. Blocked on the verifier contract
  (the verdict is central evidence) and the state model (settled).
depends_on:
  - verifier-agent-contract
  - verify-state-model
acceptance_criteria:
  - id: decision-recorded
    criterion: resolution field names the chosen option and its rationale
  - id: evidence-list-named
    criterion: resolution names exactly which evidence blocks the verify screen shows, in what order
  - id: flip-flow-named
    criterion: resolution describes the accept interaction from key press to ✓✓ mark, including the rejection path (no mark, reason stays viewable)
  - id: map-updated
    criterion: fog graduated into new nodes and affected nodes amended
constraints:
  - Decision only — no implementation in this node
  - Only the human produces ✓✓
allowed_execution_modes:
  - human
required_artifacts: []
status: ready
priority: high
unlocks: []
resolution: |
  2026-08-16 (charting, Sab): Review moment = the Evidence room: run
  artifacts (output tail, git diff, validation) + nvim/fzf + git + the
  verifier's viewable reason. Accept: `a` → y/n confirm → packet flips
  verified: review → ✓✓ → archive to tasksCompleted/<date>/. Reject: `e`
  edit / `x` defer (stays in deck) / `r` refire — no mark, no archive. Only
  the human produces ✓✓.
