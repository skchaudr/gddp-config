schema_version: '1.0'
schema_type: project_graph
project_id: aa-hub-create
project_name: AA-HUB Create — Form Weaver pathway
description: >-
  Implement the Create walk as five PATH stages (verb → card → slots →
  dispatch → fire) with PACKET YAML always in column 3, matching
  hub-rs/docs/PRD-aa-hub-create.md and the Lovable frames in
  hub-rs/examples/*.png.
repo: skchaudr/aa-cli
blueprint:
  vision: >-
    Create authors a six-field packet and fires it: PATH on the left, the
    current picker or brief in the center, live authoring YAML on the right.
  architecture_notes: >-
    Product source is the PRD plus the 13 Lovable frames
    (docs/tui-pass/lovable-prototype-spec.md). Work lives in the aa-cli
    hub-rs crate (ratatui). PATH has exactly five stages; wording is late;
    every blank is a picker with ctrl+enter typed escape; fire writes the
    ledger and hands off to the target. Graph truth stays human-owned.
    Existing create-task-authoring / create-linear-surface nodes named the
    need; this graph is the surface they were missing.
  major_capabilities:
  - repair Create input so the five-stage walk is traversable
  - verb-first entry and verb-filtered card picker
  - slot pickers with fuzzy filter, typed fallback, live slug
  - dispatch FIELD modals that update PACKET YAML live
  - fire well-formed recap plus ledger write and target handoff
  - PRD section 7 A-F coherence audit with a cited compliance report
execution_policy:
  default_executor: cursor_cli
  frontier_auto_advance: true
  retry_budget: 2
  allowed_repos:
  - skchaudr/aa-cli
  max_concurrent_jobs: 1
  require_human_review_before_overnight: false
  artifact_gate_enforced: true
