schema_version: "1.0"
schema_type: node

node_id: node-10-vercel-domain-checklist
title: Create Vercel domain switch and deployment checklist
type: capability

why: Provide Saboor with a clear step-by-step checklist to reassign the saboorkc.dev Vercel domain from the old Next.js repo to the new skc-new TanStack Start repo.

depends_on:
  - node-09-build-lint-pass

acceptance_criteria:
  - id: checklist-created
    criterion: DEPLOYMENT-CHECKLIST.md exists in skc-new repo root with exact Vercel project linking and domain re-pointing instructions
  - id: env-vars-documented
    criterion: All required Vercel environment variables (Sentry, Analytics, etc.) are documented

constraints:
  - Keep instructions actionable and minimal

allowed_execution_modes:
  - local_subprocess

required_artifacts:
  - DEPLOYMENT-CHECKLIST.md

status: pending
priority: high

unlocks: []
