schema_version: '1.0'
schema_type: project_graph
project_id: agent-os
project_name: Agent OS
description: Obsidian is the visual home. Zed can open the same files. The loop is sources, normalized state, one skill, one
  output, the home note, two triggers, and write-back. Each node has one criterion.
repo: local/agentos-dashboard
blueprint:
  vision: A local vault loop over Instagram, LinkedIn, X, the daily note, Taskdog, a select list, and GitHub commit history.
    Gmail is drafted and stays off the loop.
  architecture_notes: Files land in the agentos-dashboard checkout, which Obsidian can open as the home. The August web-command-center
    chart stays in graphs/agentos-dashboard. cursor_cli. Status stays pending until Sab marks nodes ready.
  major_capabilities:
  - seven source files
  - normalized source list
  - presence-brief skill and artifact
  - Obsidian home link
  - manual and Monday triggers for the same skill
  - write-back into sources
graph_version: '1.0'
