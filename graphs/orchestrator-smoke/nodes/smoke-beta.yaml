schema_version: '1.0'
schema_type: node
node_id: smoke-beta
title: 'Smoke: create the beta marker'
type: capability
why: Second independent node of the orchestrator wake smoke — gives the allocator
  a pacing decision across wakes.
depends_on: []
acceptance_criteria:
- id: beta-file-exists
  criterion: smoke/beta.md exists and is non-empty
- id: beta-marker
  criterion: smoke/beta.md contains the word beta
- id: beta-date
  criterion: smoke/beta.md contains the date 2026-09-05
constraints:
- Create only smoke/beta.md
- Leave changes as uncommitted working-tree edits
allowed_execution_modes:
- cursor_cli
required_artifacts:
- smoke/beta.md
status: ready
priority: low
unlocks: []
