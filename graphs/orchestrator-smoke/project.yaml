schema_version: '1.0'
schema_type: project_graph
project_id: orchestrator-smoke
project_name: Orchestrator Smoke (heartbeat wake trial)
description: Three independent nodes proving the heartbeat orchestrator wake is what
  dispatches work. No frontier_auto_advance and no default_executor — the only
  dispatch source is the orchestrator's decision channel.
repo: local/gddp-soak-target
blueprint:
  vision: Prove the stateless orchestrator wake reads the pack, decides dispatch,
    and the runtime carries that decision through executor, evaluator, and the
    human gate.
  architecture_notes: Three independent ready nodes, capacity 2, one decision per
    wake — the orchestrator paces fan-out across pulses. cursor_cli for both
    roles; models pinned per role under execution_policy.models.
  major_capabilities:
  - orchestrator-driven dispatch
graph_version: '1.0'
