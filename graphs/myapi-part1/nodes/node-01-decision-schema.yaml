schema_version: '1.0'
schema_type: node
node_id: node-01-decision-schema
title: Establish the canonical decision-object schema
type: capability
why: 'Stage A - the first work of Part 1 is decision objects, not context architecture. Define the canonical shape every later
  stage consumes. Includes the minimal scaffold the memo allows: the four stage rooms with a short CONTEXT.md each, only so
  fresh agents can navigate. Nothing more.'
depends_on: []
acceptance_criteria:
- id: schema-written
  criterion: '01-decisions/output/decision-schema.md defines the canonical decision object: field names, types, required vs
    optional, plus two filled examples drawn from real MyAPI decisions'
- id: fields-cover-eval-set
  criterion: 'The schema can express the fixed evaluation set: what was decided, rationale, supersession (replaces/replaced-by),
    and relationships between decisions'
- id: minimal-scaffold
  criterion: The four stage rooms 01-decisions/, 02-corpus/, 03-ingestion/, 04-evaluation/ exist, each with a CONTEXT.md of
    at most 30 lines saying what the room is for and what it consumes/produces; AGENTS.md gains at most a short appended routing
    section (existing content preserved)
constraints:
- The governing memo is /Users/sab-mini/repos/GDDP v MyAPI Part 1 - the first slice.md - read it first.
- Create directories and markdown only; append to AGENTS.md, never overwrite it - the existing operating notes are load-bearing
- 'No task-contract files, no content from later stages: this node defines the schema and the rooms, nothing else'
- 'Execution trio (operator direction 2026-08-13): main pi session runs gpt-5.6-sol; delegate with up to 5 subagents on model
  xai/grok-4.6 via the subagent tool''s model parameter; close with one oracle or reviewer pass before returning'
allowed_execution_modes:
- pi_rpc
required_artifacts:
- 01-decisions/output/decision-schema.md
- 01-decisions/CONTEXT.md
- 02-corpus/CONTEXT.md
- 03-ingestion/CONTEXT.md
- 04-evaluation/CONTEXT.md
status: ready
priority: high
unlocks: []
