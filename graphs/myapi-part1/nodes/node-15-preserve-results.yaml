schema_version: '1.0'
schema_type: node
node_id: node-15-preserve-results
title: Preserve run evidence and close Part 1
type: capability
why: Stage I + Stop. Raw answers, retrieved evidence, and run metadata preserved; the slice terminates regardless of answer
  quality.
depends_on:
- node-12-eval-factual-rationale
- node-13-eval-supersession-relationship
- node-14-eval-negative-control
acceptance_criteria:
- id: evidence-preserved
  criterion: 04-evaluation/results/part1-summary.md links every query result file, the validation report, repro report, ingest
    report, and retrieval check - the full evidence chain in one page
- id: run-metadata
  criterion: 'part1-summary.md records run metadata: dates, graph job ids, Khoj target, corpus decision count'
- id: diagnostic-surface
  criterion: part1-summary.md closes with the memo's diagnostic list (representation, corpus construction, chunking, metadata,
    retrieval, query formulation, Khoj) annotated with which stages the evidence now implicates or clears - observation only,
    no Part 2 scope
constraints:
- 'Thin-node contract: this yaml schedules the work; the semantic room''s CONTEXT.md and tasks/<task>.md hold the working
  instructions. Read them first.'
- Follow 04-evaluation/tasks/preserve-results.md
- This node ends Part 1. Do not propose or start Part 2 work
- 'Execution trio (operator direction 2026-08-13): main pi session runs gpt-5.6-sol; delegate with up to 5 subagents on model
  xai/grok-4.6 via the subagent tool''s model parameter; close with one oracle or reviewer pass before returning'
allowed_execution_modes:
- pi_rpc
required_artifacts:
- 04-evaluation/results/part1-summary.md
status: pending
priority: high
unlocks: []
