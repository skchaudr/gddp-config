schema_version: '1.0'
schema_type: project_graph
project_id: myapi-part1
project_name: 'MyAPI Part 1 - the first slice: decisions -> corpus -> Khoj answers'
description: 'Can MyAPI turn a clean authoritative snapshot of project decisions into a reproducible corpus Khoj retrieves
  and answers against? Decision objects first, minimal scaffold only. Query results end the slice regardless of quality. Source
  memo: GDDP v MyAPI Part 1 - the first slice.md (2026-08-13).'
repo: /Users/sab-mini/repos/MyAPI
blueprint:
  vision: 'GDDP schedules work the project itself knows how to explain: thin nodes point at ICM room task contracts; fresh
    pi_rpc agents execute per room; the slice ends with preserved Khoj answers to five fixed queries plus a negative control.'
  architecture_notes: 'Stage A first: node-01 is the decision schema with only the memo''s minimal scaffold (rooms + short
    CONTEXT stubs, AGENTS.md append-only). No task-contract layer in this slice. Stages chain decisions -> corpus -> ingestion
    -> evaluation; evaluation splits three ways concurrent after retrieval verification; node-14 closes. Executor trio per
    node: gpt-5.6-sol main, up to 5 grok-4.6 subagents, one oracle/review pass.'
  major_capabilities:
  - canonical decision-object schema + validated canonical set
  - reproducible corpus generation
  - Khoj ingestion + retrieval verification
  - fixed-set evaluation with negative control, quality recorded not gated
