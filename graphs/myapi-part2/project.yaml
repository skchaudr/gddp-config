schema_version: '1.0'
schema_type: project_graph
project_id: myapi-part2
project_name: MyAPI Part 2 - which sources produce grounded project-history answers
description: 'Controlled experiment over real project history: build a reproducible multi-source corpus (anchor, decisions,
  handoffs, git, graphify) and measure what each source contributes to retrieval quality, answer quality, grounding/provenance,
  and abstention under a frozen ruler. GDDP gates execution correctness, never whether the hypothesis won. Source memo: docs/GDDPvMyAPI-Part2.md.'
repo: /Users/sab-mini/repos/MyAPI
blueprint:
  vision: MyAPI ends Part 2 with a reproducible, multi-source project corpus and measured evidence showing what each source
    contributes to grounded answers - the evidence base for Part 3 routing.
  architecture_notes: '18 nodes from the Part 2 memo. Foundation (01 contract, 02 chat/scorer probe) gates concurrent source
    inventory (03-07), then layer build (08), corpus validation (09), ruler freeze (10), six concurrent controlled treatments
    (11-16), CLI gap-fill with untouched holdout (17), and convergence (18). Executor model per operator direction 2026-08-15:
    main pi_rpc session on gpt-5.6-sol orchestrates only - workers are up to 5 xai/grok-4.6 subagents, one DeepSeek V4 Flash
    watcher subagent replaces polling, one oracle/review pass closes each node. Stop boundary: no routing intelligence in
    Part 2.'
  major_capabilities:
  - mechanically actionable evidence contract
  - independently composable provenance-preserving source layers with manifests and hashes
  - frozen evaluation ruler with untouched holdout
  - six controlled treatments + Part 1 continuity control with preserved raw evidence
  - classified durable-source failures and a bounded CLI-derived gap-fill treatment
  - convergence report distinguishing measured results from analyst inference
