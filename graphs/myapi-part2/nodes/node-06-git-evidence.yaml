schema_version: '1.0'
schema_type: node
node_id: node-06-git-evidence
title: Capture Git temporal/change evidence
type: capability
why: 'Git supplies what-changed evidence: commits, timestamps, parents, affected files, messages, and sufficient change evidence,
  reproducibly.'
depends_on:
- node-01b-contract-review
acceptance_criteria:
- id: export-created
  criterion: part2/layers/git/ contains a generated commit export covering commits, timestamps, parents, affected files, commit
    messages, and the change evidence the contract requires, for the repositories the contract names
- id: reproducible
  criterion: The exact script used is saved at part2/layers/git/build_git_export.(py|sh) and re-running it produces byte-identical
    output (the recorded sha256 matches on rebuild)
- id: absolute-dates
  criterion: Every date in the export is an absolute ISO-8601 date (no relative dates)
