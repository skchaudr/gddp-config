- 'Execution model (operator direction 2026-08-15, enforced by the attempt preamble): You are the ORCHESTRATOR, not the worker.
  Do NOT perform the node''s work yourself. Decompose it and dispatch worker subagents (up to 5 concurrent, model xai/grok-4.6
  via the subagent tool''s model parameter) to do the actual investigation, construction, and measurement. Your job is decomposition,
  dispatch, reviewing returns, integrating, and producing the final artifacts.'
- 'Watching (operator direction 2026-08-15): never block on sleep loops or polling scripts. When work is in flight (worker
