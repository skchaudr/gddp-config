schema_version: '1.0'
schema_type: node
node_id: node-17-gap-fill-cli
title: Analyze failures and run the CLI gap-fill treatment
type: capability
why: Only knowledge genuinely absent from durable sources earns CLI-session investigation. Test whether CLI-derived knowledge
  generalizes beyond the questions that caused its inclusion.
depends_on:
- node-12-treatment-decisions
- node-13-treatment-no-decisions
- node-14-treatment-handoffs
- node-15-treatment-code-reality
- node-16-treatment-full-durable
acceptance_criteria:
- id: failures-classified
  criterion: part2/analysis/failure-classes.md classifies every durable-treatment failure into exactly one class - retrieval-missed,
    synthesis-failed, or genuinely-absent - with the question id and evidence for each classification
- id: cli-layer-bounded
  criterion: Only genuinely-absent facts were extracted from session history into a provenance-preserving part2/layers/cli-derived/
    layer, each item citing its session source
- id: targeted-rerun
  criterion: The targeted questions were rerun with the cli-derived layer added, and results preserved under part2/treatments/cli-gap-fill/
- id: holdout-tested
  criterion: The untouched holdout subset was run exactly once, against the cli-gap-fill treatment, and results preserved
    under part2/treatments/cli-gap-fill/holdout/
constraints:
- The governing memo is /Users/sab-mini/repos/gddp-config/docs/GDDPvMyAPI-Part2.md - read it first. GDDP gates whether the
  experiment was executed correctly, never whether the hypothesis won.
- 'Execution model (operator direction 2026-08-15, enforced by the attempt preamble): You are the ORCHESTRATOR, not the worker.
  Do NOT perform the node''s work yourself. Decompose it and dispatch worker subagents (up to 5 concurrent, model xai/grok-4.6
  via the subagent tool''s model parameter) to do the actual investigation, construction, and measurement. Your job is decomposition,
  dispatch, reviewing returns, integrating, and producing the final artifacts.'
- 'Watching (operator direction 2026-08-15): never block on sleep loops or polling scripts. When work is in flight (worker
  subagents, Khoj ingestion/processing, long builds), dispatch ONE watcher subagent on model deepseek/deepseek-v4-flash that
  actively polls with tools (job status, logs, artifact existence) and reports state changes; you go idle between its reports
  instead of polling yourself.'
- 'Think past this node: graph completion is the goal, not this node alone. You persist beyond node boundaries, so leave part2/
  self-describing (manifests, paths, conventions) such that the next node starts without archaeology. Attach discoveries to
  this node as evidence; work discovered beyond this node''s scope becomes a continuation proposal, never silent execution.'
- Work in /Users/sab-mini/repos/MyAPI. Write only under part2/ unless this node's text names another path. Never edit GDDP
  graph truth, runtime databases, or job state.
- 'Experimental gate: you are gated on correct execution and preserved evidence, never on whether a treatment performed well.
  A poorly-performing treatment executed correctly PASSES. Record regressions and source pollution as findings; never tune
  the corpus, questions, or ruler to improve scores.'
- Retrieval-missed and synthesis-failed failures are findings, not gaps - they never earn CLI extraction.
- Close with parallel reviewer subagents on model deepseek/deepseek-v4-pro, each assigned a different explicit focus (criteria
  coverage, evidence integrity, constraint compliance). Resolve their findings before returning.
allowed_execution_modes:
