title: "Written seam \u2014 aa-cli stays the fire/verify TUI on both hosts"
type: capability
why: 'The port''s over-reach risk is wrapping aa-cli (Rust+zsh operator TUI,

  targets.conf, present on both hosts) as a Pi extension or dsh effect, or

  porting verify rooms into either harness. The boundary is written so the

  daily driver never absorbs it.

  '
