- inventory-extension-catalog
acceptance_criteria:
- criterion: A decision doc states aa-cli remains the fire/verify TUI on both hosts, Pi stays the coding harness (sab-mini),
    dsh stays the agent harness (sab-air), and no verify-room/deck port crosses any boundary, citing LOOP.md / GDDP-becomes-small-and-real.md
    intent.
  id: seam-doc
- criterion: The only sanctioned cross-points are named (dispatch targets, receipts), with ad-hoc cross-points listed for
    removal.
  id: interface
- criterion: MAP.md notes the aa-cli TUI pass is charted separately (aa-cli-tui-pass); this graph has no aa-cli implementation
    nodes.
  id: graph-scope
constraints:
- Written boundary only; no changes to aa-cli, Pi, or dsh.
