schema_version: "1.0"
schema_type: node
node_id: aa-cli-boundary
title: Written seam — aa-cli stays the fire/verify TUI on both hosts
type: capability
why: |
  The port's over-reach risk is wrapping aa-cli (Rust+zsh operator TUI,
  targets.conf, present on both hosts) as a Pi extension or dsh effect, or
  porting verify rooms into either harness. The boundary is written so the
  daily driver never absorbs it.
depends_on:
  - inventory-extension-catalog
acceptance_criteria:
  - id: seam-doc
    criterion: A decision doc states aa-cli remains the fire/verify TUI on both
      hosts, Pi stays the coding harness (sab-mini), dsh stays the agent harness
      (sab-air), and no verify-room/deck port crosses any boundary, citing
      LOOP.md / GDDP-becomes-small-and-real.md intent.
  - id: interface
    criterion: The only sanctioned cross-points are named (dispatch targets,
      receipts), with ad-hoc cross-points listed for removal.
  - id: graph-scope
    criterion: MAP.md notes the aa-cli TUI pass is charted separately
      (aa-cli-tui-pass); this graph has no aa-cli implementation nodes.
constraints:
  - Written boundary only; no changes to aa-cli, Pi, or dsh.
allowed_execution_modes:
  - pi
  - human
required_artifacts:
  - /Users/sab-mini/repos/aa-cli/gddp/CANONICAL.md
  - /Users/sab-mini/repos/gddp-runtime/docs/proposals/LOOP.md
  - /Users/sab-mini/repos/gddp-runtime/docs/decisions/GDDP-becomes-small-and-real.md
status: planned
priority: high
unlocks:
  - dogfood-session
