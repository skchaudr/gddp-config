schema_version: "1.0"
schema_type: node
schema_version: '1.0'
schema_type: node
node_id: enable-set-policy
title: "Pi enable-set policy \u2014 settings.json packages[] diff (unapplied)"
type: capability
why: "The live sab-mini settings.json is the real Pi daily driver. The policy\nsays what stays in packages[], what gets uninstalled,\
  \ what stays local-only.\nNever applied by an executor \u2014 diffed for Sab.\n"
depends_on:
- package-manifest
acceptance_criteria:
- criterion: A proposed settings.json diff exists: keep / uninstall / local-only per package, each row citing the tier from
    node 02.
  id: policy-diff
- criterion: The diff is NOT applied to live settings; presented with exact revert instructions for human acceptance.
  id: unapplied
- criterion: "pi-telegrams presence respects USER.mds Telegram boundary \u2014 in the policy or explicitly optional, decided\
    \ by Sab."
  id: telegram-bounded
constraints:
- "Proposal only \u2014 human accept applies the diff."
allowed_execution_modes:
- agent
- human
required_artifacts:
- ~/.pi/agent/settings.json (proposed diff, sab-mini)
status: pending
priority: high
unlocks:
- dogfood-session
