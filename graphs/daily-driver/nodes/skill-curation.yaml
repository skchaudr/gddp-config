schema_version: "1.0"
schema_type: node
schema_version: '1.0'
schema_type: node
node_id: skill-curation
title: Daily-driver skill allowlist (both hosts)
type: capability
why: "Skills are already shared via ~/.agents/skills on sab-mini; dsh has its own\ngoals/skills/workflows on sab-air. Port\
  \ means curating the allowlist per\nhost \u2014 gddp/memory/grill/code families belong; teaching/bailian families\nare optional;\
  \ nothing is rewritten.\n"
depends_on:
- inventory-extension-catalog
acceptance_criteria:
- criterion: An allowlist file names the daily-driver skill set per host with one-line purpose per skill (sab-mini: ~/.agents/skills
    + ~/.pi/agent/skills; sab-air: dsh goals/skills/workflows).
  id: allowlist
- criterion: Skills are grouped by family with keep/optional/exclude tags.
  id: families
- criterion: The allowlist matches what each host actually loads after enable-set/config application; mismatches listed.
  id: load-truth
constraints:
- Curate/document only; no skill content changes on either host.
allowed_execution_modes:
- agent
- human
required_artifacts:
- ~/.agents/skills/ (sab-mini)
- ~/.pi/agent/skills/ (sab-mini)
- ~/.dsh profiles/skills (sab-air)
status: pending
priority: medium
unlocks:
- dogfood-session
