schema_version: "1.0"
schema_type: node
schema_version: '1.0'
schema_type: node
node_id: mux-stack
title: Compose the Pi coordination stack without double-binding (sab-mini)
type: capability
why: 'pi-subagents + pi-intercom + pi-boss/pi-room + herdr mux form the rooms

  stack on sab-mini, but nothing documents which loads when and which slash

  commands bind where. Double-bound commands are a daily-driver hazard.

  '
depends_on:
- inventory-extension-catalog
acceptance_criteria:
- criterion: A matrix lists every coordination surface with its commands and highlights double-bound slash commands.
  id: conflict-matrix
- criterion: Recommended enable/load order is documented with rationale.
  id: load-order
- criterion: Binding conflicts get resolution recommendations for Sabs accept (not silently changed).
  id: recommendation
constraints:
- Documentation/conflict analysis only; no config changes.
allowed_execution_modes:
- agent
- human
required_artifacts:
- ~/.pi/agent/settings.json
- ~/.pi/agent/npm/node_modules/pi-subagents/
- ~/.pi/agent/npm/node_modules/pi-intercom/
status: pending
priority: medium
unlocks:
- dogfood-session
