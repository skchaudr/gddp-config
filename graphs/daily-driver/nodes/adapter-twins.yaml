node_id: adapter-twins
title: "One capability, N adapters \u2014 twins across Pi / dsh / Hermes"
type: capability
why: "Policy twins already dual-home (noise-trim, herdr, moshi as Pi TS + Hermes\nPython). With dsh in the picture, the twin\
  \ question spans three runtimes:\nPi ExtensionAPI, dsh reversible effects, Hermes plugin.yaml. The daily\ndriver treats\
  \ each capability as one behavior with N adapters \u2014 never a\nfourth runtime.\n"
depends_on:
- split-architecture-decision
acceptance_criteria:
- criterion: A one-page contract per twin capability: shared behavior, adapter per runtime (Pi extension / dsh effect / Hermes
    plugin), file map, and the behavior-integrity check that keeps them in sync.
  id: twin-contract
- criterion: noise-trim, herdr-agent-state, moshi-hooks are all mapped across the runtimes that carry them; dsh-side twins
    found in node 03 are added.
  id: coverage
- criterion: The spec states no new runtime/plugin file format is introduced for twins.
  id: no-new-runtime
constraints:
- "Spec/documentation only \u2014 no behavior changes."
allowed_execution_modes:
- agent
- human
required_artifacts:
- ~/.pi/agent/extensions/ (sab-mini)
- ~/.hermes/plugins/ (sab-mini)
- ~/.dsh/ (sab-air)
status: pending
priority: medium
unlocks:
- dogfood-session
