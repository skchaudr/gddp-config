schema_version: '1.0'
schema_type: node
node_id: frontend-integration
title: Hub calls only documented aa subcommands; no parallel fire path
type: capability
why: "With the backend nodes closed, the hub's exec.rs/fire.rs must call exactly\nthe documented bin/aa subcommands \u2014\
  \ one dispatch path, no parallel fire\nlogic living in the frontend.\n"
depends_on:
- backend-deck-actions
- backend-packet-schema-align
- backend-create-verb-edges
- backend-registry-dispatch
acceptance_criteria:
- criterion: A command table in exec.rs/fire.rs maps every hub action to one documented `aa` subcommand; no parallel dispatch
    path exists.
  id: command-table
- criterion: Every hub action consumes the backend receipt/toast contract (success + error) from bin/aa.
  id: receipts
- criterion: "An end-to-end run (deck \u2192 fire \u2192 verify) passes with only documented subcommands, cited by executed\
    \ commands."
  id: e2e
constraints:
- "Integration only \u2014 no new UI rooms or new subcommands in this node."
allowed_execution_modes:
- agent
- human
required_artifacts:
- hub-rs/src/exec.rs
- hub-rs/src/fire.rs
- bin/aa
status: pending
priority: high
unlocks:
- operator-walkthrough
