schema_version: '1.0'
schema_type: node
node_id: design-review
title: Review audit findings and decide what they mean for aa-cli
type: review
why: 'The audit produces findings; it does not say what to do. This node is the judgment step — weigh which surfaces materially
  hurt the operator''s trust and which are cosmetic, then decide the invariant-grounded capability boundaries for Phase 2.
  The invariant it protects: the implementation direction must follow from assessed state, not from a pre-imagined decomposition.
  Resolves the Phase-2 node set, in order, from candidates.'
depends_on:
- tui-methodology-audit
acceptance_criteria:
- id: decision-recorded
  criterion: A written review record names, per audit finding, the disposition — must-fix / should-fix / won't-now — with
    rationale and a reference to the candidate capability that will carry it into Phase 2.
- id: phase2-set
  criterion: The review names the Phase-2 capability nodes (bounded, invariant- grounded) and their execution order, drawn
    from candidates plus any new boundaries the findings expose — not committed to the old chart's decomposition.
- id: invariants-concrete
  criterion: The invariants (one predictable input grammar, no dead-ends/modal-trap, evidence visible in-TUI, semantic color,
    spatial continuity) are made specific to aa-cli's surfaces as the acceptance bar Phase-2 nodes build toward.
constraints:
- Review/judgment only — no implementation in this node.
- Decides direction; does not build. Authorizes Phase-2 nodes to be created.
allowed_execution_modes:
- agent
- human
required_artifacts:
- audits/design-review.md
status: pending
priority: high
unlocks: []
