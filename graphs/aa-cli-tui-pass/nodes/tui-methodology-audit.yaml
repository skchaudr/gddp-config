schema_version: '1.0'
schema_type: node
node_id: tui-methodology-audit
title: Audit every aa-cli surface against the three TUI methodologies
type: audit
why: 'The TUI-design skill existed as reference context but was never systematically applied — it was read, not used. This
  graph cannot improve aa-cli until it knows, with traceable evidence, how each surface actually measures against the explicit
  methodology. The invariant that grounds this node: an improvement pass must be anchored to assessed state, not to an imagined
  target. Produces findings; decides nothing.'
depends_on:
- tui-inventory-and-keymap-audit
acceptance_criteria:
- id: per-surface-findings
  criterion: Every operator surface (Deck, runway, Create, Verify Evidence/Agent/ Contract rooms, pickers, root menu, status/footer)
    is audited against each TUI skill, with per-surface satisfies/violates findings and the exact skill section cited (design-system
    Interaction Model, Color, Seven Principles, Anti-patterns; visual-catalog Status indicators/ check-cross; app-patterns
    reference app match).
- id: referenced-sections
  criterion: Findings cite the skill sections by name — not vibes — e.g. keyboard layers L0-L3, focus management, three-tier
    help, semantic color slots, NO_COLOR, anti-pattern IDs 1-10, check/cross glyph semantics.
- id: traceable
  criterion: Every finding maps to a live aa-cli file path (hub-rs/src/ui/*.rs, bin/aa, lib/*.zsh, docs/fzf-face.md, keymap.rs)
    — no summary claims without a cited surface.
constraints:
- Audit only — records findings; draws no conclusion about what aa-cli should become.
- Read-only over aa-cli; no behavior changes.
- Do not modify the pilot graph (aa-cli/gddp/) statuses.
allowed_execution_modes:
- agent
- human
required_artifacts:
- audits/tui-methodology.md
status: provisional
priority: high
unlocks:
- design-review
