schema_version: "1.0"
schema_type: node
schema_version: '1.0'
schema_type: node
node_id: backend-deck-actions
title: "Close deck-action-wiring \u2014 focused deck keys hit bin/aa with receipts"
type: capability
why: 'The Deck is useful only if the focused packet can be inspected, fired,

  verified, and reviewed through reliable key actions. The pilot graph''s

  deck-action-wiring is still in_progress; this node lands it under the

  TUI-pass contract.

  '
depends_on:
- tui-inventory-and-keymap-audit
acceptance_criteria:
- criterion: f fires the focused packet through bin/aa and returns a receipt/toast in-TUI.
  id: focused-fire
- criterion: o opens the latest output.log for the focused packet when available.
  id: focused-output
- criterion: Enter opens a detail view with packet fields and output tail.
  id: focused-detail
- criterion: v invokes verify for the focused packet and preserves backend authority.
  id: focused-verify
constraints:
- No task editing in the Deck; editing belongs to Create/refinement.
allowed_execution_modes:
- agent
- human
required_artifacts:
- bin/aa
- lib/*.zsh
- hub-rs/src/ui/dashboard.rs
status: pending
priority: high
unlocks:
- frontend-integration
