schema_version: '1.0'
schema_type: node
node_id: tui-verify-rooms-polish
title: Verify Evidence/Agent/Contract rooms to tui-design standard
type: capability
why: 'Verify''s 3-room grammar (Evidence / Agent / Contract) landed via the

  verify slices, but the rooms haven''t had a tui-design pass (focus

  management, picker-not-keybar patterns, status glyph language). It is the

  load-bearing acceptance surface — only human ✓✓ releases.

  '
depends_on:
- tui-inventory-and-keymap-audit
- tui-visual-system
acceptance_criteria:
- id: room-polish
  criterion: Each verify room applies the visual system and tui-design focus rules;
    evidence picker is picker-first (nucleo), not keybar-accumulated.
- id: status-language
  criterion: white/green/red ✓ and ✓✓ render per the visual system and stay machine/agent/human-authority-accurate.
- id: no-contract-drift
  criterion: 'Verify schema behavior (verified: completion|review) unchanged; this
    node is visual only.'
constraints:
- Visual/focus polish only; no schema or authority changes.
allowed_execution_modes:
- agent
- human
required_artifacts:
- hub-rs/src/ui/verify.rs
- docs/verify-slices/
status: pending
priority: high
unlocks:
- operator-walkthrough
