schema_version: '1.0'
schema_type: node
node_id: review-product-coherence
title: Whole-product review — is the integrated aa-cli coherent and good?
type: milestone
why: 'The final audit answers whether aa-cli satisfies the explicit criteria; this
  review answers a different question — whether the integrated product is coherent
  and good as an operating surface. Coherence is a judgment about the whole, not a
  checklist. It must run before the final audit so the audit reflects a product already
  held to the standard of quality reasoning, and so problems this review finds are
  corrected before compliance is measured. Invariant it protects: don''t audit a product
  the reviewer has just judged needs correction.'
depends_on:
- milestone-integration
acceptance_criteria:
- id: coherence-judgment
  criterion: A written review renders a reasoned judgment on the integrated product
    — spatial memory, discoverability, input grammar, status clarity, real operator
    flow — with findings for any roughness, each mapped to the capability or milestone
    that must correct it.
- id: readability
  criterion: A human can walk the product and say what it does and where every action
    leads, without reading source — the discoverability bar named in the design-review
    invariants.
- id: correction-routing
  criterion: Any correction this review surfaces is routed to its owning node (re-opened
    or a continuation proposal) and resolved before the final audit runs.
constraints:
- Review only — reasoned judgment, no implementation.
- Runs BEFORE audit-methodology-compliance; this ordering is deliberate.
allowed_execution_modes:
- agent
- human
required_artifacts:
- reviews/product-coherence.md
status: provisional
priority: high
unlocks:
- audit-methodology-compliance
