node_id: backend-create-verb-edges
title: "Fix create verb edges \u2014 Enter-as-call, sticky pathway, blank respond"
type: capability
why: "The 7.29.26 verb-first plan shipped P0\u2013P3 but left known edge bugs:\nEnter-as-call while the verb pathway is set,\
  \ sticky pathway state, and\nempty follow-up re-firing. These make the create room unreliable for\ndispatch and block the\
  \ walkthrough.\n"
depends_on:
- tui-create-linear-room
acceptance_criteria:
- criterion: Enter behaves per the linear room design (insert vs call context), never misfiring a call with an empty/unchanged
    prompt.
  id: enter-semantics
- criterion: Pathway state resets after fire/cancel; no sticky verb across sessions.
  id: pathway-reset
- criterion: Empty follow-up cannot re-fire a packet; the room shows a disabled/explain state instead.
  id: blank-guard
- criterion: cargo tests cover the three edge cases with cited main.rs/app.rs lines.
  id: regression-tests
constraints:
- Backend/dispatch edges only; room chrome belongs to node 04.
allowed_execution_modes:
- agent
- human
required_artifacts:
- hub-rs/src/main.rs
- hub-rs/src/app.rs
- bin/aa
status: pending
priority: high
unlocks:
- frontend-integration
