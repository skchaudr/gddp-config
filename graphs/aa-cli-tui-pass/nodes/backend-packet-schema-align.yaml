node_id: backend-packet-schema-align
title: Reconcile dual packet field models (AGENTS vs hub-authored)
type: capability
why: "Packets are authored under two field models (AGENTS.md packet fields vs\nhub-authored fields; validated vs verified/verdict\
  \ dual-write). The pilot\ncharted packet-schema-align but never closed it \u2014 schema drift surfaces as\nverify/ledger\
  \ confusion downstream.\n"
depends_on:
- tui-inventory-and-keymap-audit
acceptance_criteria:
- criterion: One canonical packet schema (schema/packet.schema.json) is the source of truth; AGENTS.md and hub-authored fields
    reconcile to it.
  id: schema-source
- criterion: validated vs verified/verdict fields are distinct, non-conflicting, and ledger never releases a packet except
    through human review.
  id: dual-write
- criterion: Existing packets validate against the reconciled schema (validation run cited).
  id: no-legacy-drift
constraints:
- Schema reconciliation only; no verify authority changes.
allowed_execution_modes:
- agent
- human
required_artifacts:
- schema/packet.schema.json
- lib/validate.zsh
status: pending
priority: medium
