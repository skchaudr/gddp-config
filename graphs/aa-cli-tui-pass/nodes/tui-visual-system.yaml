schema_version: '1.0'
schema_type: node
node_id: tui-visual-system
title: Establish one shared visual system across all rooms
type: capability
why: 'The tui-design pass needs a single language of density, glyphs, truncation,

  and empty states so Deck, Create, and Verify rooms don''t each invent their

  own. Currently no shared style tokens exist; render tests are the evidence

  surface.

  '
depends_on:
- tui-inventory-and-keymap-audit
acceptance_criteria:
- id: style-tokens
  criterion: A shared style/visual-system module exists in hub-rs (density, spacing,
    status glyphs white/green/red ✓ ✓✓, truncation rules, empty states) used by all
    rooms.
- id: render-tests
  criterion: Before/after render tests in hub-rs/tests cover each room's empty, normal,
    and dense states against the tokens.
- id: no-regressions
  criterion: Existing keymap and room behavior unchanged except visual surface.
constraints:
- Visual surface only; no keybinding or behavior changes in this node.
allowed_execution_modes:
- agent
- human
required_artifacts:
- hub-rs/src/ui/
- hub-rs/tests/
status: pending
priority: high
unlocks:
- tui-deck-runway-pass
- tui-create-linear-room
- tui-verify-rooms-polish
