schema_version: '1.0'
schema_type: node
node_id: tui-inventory-and-keymap-audit
title: Walk every aa-cli surface against the tui-design skill; produce a binding map
type: capability
why: 'The graph''s root. aa-cli finished its foundational pass (deck-home, verify

  3-room grammar, verb-first create) but no single document maps every

  operator surface to the tui-design process or to the live keymap. Without

  the inventory, the design and backend nodes have no shared ground truth.

  '
depends_on: []
acceptance_criteria:
- id: surface-inventory
  criterion: Every operator surface (Deck, runway, Create, Verify rooms, pickers,
    root menu) is walked against hub-rs/.agents/skills/tui-design/SKILL.md and listed
    in one inventory markdown with a tui-design verdict per surface.
- id: binding-map
  criterion: A key-binding map exists — each surface's keys vs hub-rs/src/keymap.rs
    vs AGENTS.md defaults — with conflicts listed (e.g. fzf must stay on ';', not
    'f').
- id: gap-list
  criterion: UI/UX gaps and backend-wiring gaps are each enumerated with exact file
    paths (hub-rs/src/ui/*.rs, bin/aa, lib/*.zsh) for downstream nodes.
constraints:
- Read-only pass over aa-cli; no behavior changes in this node.
- Do not modify the stale pilot graph (aa-cli/gddp/) statuses.
allowed_execution_modes:
- agent
- human
required_artifacts:
- hub-rs/src/keymap.rs
- hub-rs/.agents/skills/tui-design/SKILL.md
- bin/aa
status: complete
priority: high
unlocks:
- tui-visual-system
- tui-deck-runway-pass
- tui-create-linear-room
- tui-verify-rooms-polish
- tui-picker-grammar
- backend-deck-actions
- backend-packet-schema-align
- backend-registry-dispatch
