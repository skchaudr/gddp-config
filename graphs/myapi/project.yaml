schema_version: '1.0'
schema_type: project_graph
project_id: myapi
project_name: MyAPI
description: Personal context engine — versioned active handoff corpus
  built from multi-source evidence, proven against a frozen Vertex baseline,
  and served through two MCP tools (get_project_context, get_person_context).
  Completion and redirection of V1, not a rewrite.
repo: skchaudr/MyAPI
blueprint:
  vision: Produce compact, verified context briefs that let a cold agent
    continue correctly — three-layer separation (registry, candidate, active),
    frozen baseline comparison, and minimal MCP surface.
  architecture_notes: 'Source registry fingerprints all material cheaply. Candidates

    are generated by shape (events from sessions, anchors from Obsidian, bounded

    events from GitHub) without moving raw sources. Only promoted items meeting

    admission requirements enter the active corpus. Corpus v1 stays a fourth cold

    store. Retrieval is proven via three-way A/B against the frozen Vertex baseline

    before any new indexing. MCP exposes exactly two tools returning ContextBrief.

    '
  major_capabilities:
  - multi-source registry with Mini/Air dedup
  - candidate generation and promotion pipeline
  - bounded active corpus (15-30 day window plus durable promotions)
  - three-way retrieval evaluation (baseline, active, active+v1-cold)
  - two-tool MCP (get_project_context, get_person_context)
  - incremental refresh without full rebuild
graph_version: '1.0'
created_at: '2026-07-28'
last_updated: '2026-07-28'
