schema_version: '1.0'
schema_type: node
node_id: node-05-test-suite-map
title: Map the test suite shape and slowest tests
type: capability
why: Suite health is invisible without a map; per-file counts and durations make test
  debt reviewable.
depends_on: []
acceptance_criteria:
- id: report-exists
  criterion: reports/gddp-dogfood/05-test-suite-map.md exists and is non-empty
- id: counts
  criterion: report contains per-file test counts for scripts/**/test_*.py
- id: durations
  criterion: report lists the slowest 10 tests from python3 -m pytest -q --durations=10
constraints:
- Create only reports/gddp-dogfood/05-test-suite-map.md
- Read-only outside that report path
- Run python3 -m pytest -q before finishing and quote its tail line in the report
- Commit all work on this node result ref per the executor contract
allowed_execution_modes:
- local_subprocess
required_artifacts:
- reports/gddp-dogfood/05-test-suite-map.md
status: provisional
priority: medium
unlocks: []
