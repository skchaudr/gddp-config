schema_version: '1.0'
schema_type: node
node_id: node-19-handoff-index
title: Build the .handoffs index
type: capability
why: One-file documentation/cleanup so the post-demolition runtime is legible to the
  next session.
depends_on: []
acceptance_criteria:
- id: artifact-exists
  criterion: .handoffs/INDEX.md exists and is non-empty
- id: covers
  criterion: the file covers every .handoffs/*.md file listed in numeric order with
    a one-line title taken from the file itself
- id: suite-unchanged
  criterion: python3 -m pytest -q shows no new failures beyond those already present
    on this host before the node (flask-import and rig1 plist asserts); quote the
    tail line in the commit message
constraints:
- Create or modify only .handoffs/INDEX.md
- Read-only outside that path
- Commit all work on this node result ref per the executor contract
allowed_execution_modes:
- local_subprocess
required_artifacts:
- .handoffs/INDEX.md
status: ready
priority: medium
unlocks: []
