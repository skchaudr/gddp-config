schema_version: '1.0'
schema_type: node
node_id: node-07-hook-surface
title: Inventory what fires on git commit/push
type: capability
why: Hook surfaces (.agents, graphify, git hooks) mutate or rebuild on repo events;
  the inventory makes side effects visible.
depends_on: []
acceptance_criteria:
- id: report-exists
  criterion: reports/gddp-dogfood/07-hook-surface.md exists and is non-empty
- id: hooks-listed
  criterion: report lists every hook surface in the repo (.agents/, .git/hooks if
    any, graphify config) with what triggers it
- id: evidence
  criterion: report quotes the config lines that install each hook
constraints:
- Create only reports/gddp-dogfood/07-hook-surface.md
- Read-only outside that report path
- Run python3 -m pytest -q before finishing and quote its tail line in the report
- Commit all work on this node result ref per the executor contract
allowed_execution_modes:
- local_subprocess
required_artifacts:
- reports/gddp-dogfood/07-hook-surface.md
status: provisional
priority: medium
unlocks: []
