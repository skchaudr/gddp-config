schema_version: '1.0'
schema_type: node
node_id: node-04-scripts-entrypoint-surface
title: Map the scripts/ CLI entrypoint surface
type: capability
why: Operators and agents reach for scripts/ entrypoints blind; a surface map makes
  the CLI layer reviewable.
depends_on: []
acceptance_criteria:
- id: report-exists
  criterion: reports/gddp-dogfood/04-scripts-entrypoint-surface.md exists and is non-empty
- id: entrypoints-listed
  criterion: report contains a table of scripts/*.py entrypoints with their argparse
    subcommands
- id: real-output
  criterion: report quotes real --help or argparse output for at least 5 entrypoints
constraints:
- Create only reports/gddp-dogfood/04-scripts-entrypoint-surface.md
- Read-only outside that report path
- Run python3 -m pytest -q before finishing and quote its tail line in the report
- Commit all work on this node result ref per the executor contract
allowed_execution_modes:
- local_subprocess
required_artifacts:
- reports/gddp-dogfood/04-scripts-entrypoint-surface.md
status: provisional
priority: medium
unlocks: []
