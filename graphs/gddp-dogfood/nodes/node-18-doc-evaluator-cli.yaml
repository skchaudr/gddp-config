schema_version: '1.0'
schema_type: node
node_id: node-18-doc-evaluator-cli
title: Document the post-hoc evaluator CLI
type: capability
why: One-file documentation/cleanup so the post-demolition runtime is legible to the
  next session.
depends_on: []
acceptance_criteria:
- id: artifact-exists
  criterion: docs/evaluator-cli.md exists and is non-empty
- id: covers
  criterion: 'the file covers the scripts/runtime/verification/cli.py invocation:
    flags, --semantic-harness pi, provider env keys (DEEPSEEK_API_KEY), and where
    receipts land, quoting real argparse help'
- id: suite-unchanged
  criterion: python3 -m pytest -q shows no new failures beyond those already present
    on this host before the node (flask-import and rig1 plist asserts); quote the
    tail line in the commit message
constraints:
- Create or modify only docs/evaluator-cli.md
- Read-only outside that path
- Commit all work on this node result ref per the executor contract
allowed_execution_modes:
- local_subprocess
required_artifacts:
- docs/evaluator-cli.md
status: ready
priority: medium
unlocks: []
