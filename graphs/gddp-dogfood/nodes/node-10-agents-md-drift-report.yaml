schema_version: '1.0'
schema_type: node
node_id: node-10-agents-md-drift-report
title: Report AGENTS.md statements that contradict current code
type: capability
why: AGENTS.md doctrine drifts as code changes; a drift report (no edits) keeps the
  contract honest.
depends_on: []
acceptance_criteria:
- id: report-exists
  criterion: reports/gddp-dogfood/10-agents-md-drift-report.md exists and is non-empty
- id: quoted-drift
  criterion: each drift claim quotes the AGENTS.md line and the contradicting code
    at file:line
- id: read-only
  criterion: the node changes no files outside the report
constraints:
- Create only reports/gddp-dogfood/10-agents-md-drift-report.md
- Read-only outside that report path
- Run python3 -m pytest -q before finishing and quote its tail line in the report
- Commit all work on this node result ref per the executor contract
allowed_execution_modes:
- local_subprocess
required_artifacts:
- reports/gddp-dogfood/10-agents-md-drift-report.md
status: ready
priority: medium
unlocks: []
