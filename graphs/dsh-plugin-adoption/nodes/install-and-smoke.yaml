schema_version: "1.0"
schema_type: node
schema_version: '1.0'
schema_type: node
node_id: install-and-smoke
title: Preflight-scan install + smoke-test each vetted plugin in isolation
type: capability
why: 'The protocol''s execution: for each VETTED-OK candidate, run the preflight

  scan chain (poison-guard / plugin-check / manifest validation), install

  into the isolated profile, run health checks, and smoke-test actual

  behavior. Evidence per plugin decides what the human can promote.

  '
depends_on:
- isolated-test-profile
acceptance_criteria:
- criterion: "Per VETTED-OK candidate: preflight scan output, install result in the isolated profile, dsh-plugin-doctor health,\
    \ and a smoke test of actual behavior \u2014 all recorded with exact commands and outputs."
  id: per-plugin
- criterion: "Any plugin that fails preflight or misbehaves under smoke is recorded as REJECT-AT-TEST with the failing evidence\
    \ \u2014 not silently dropped."
  id: fail-honest
- criterion: No install touched the live ~/.dsh; the isolation rule held throughout (cited).
  id: isolation-held
constraints:
- Isolated profile only; no live ~/.dsh mutations; no commits.
allowed_execution_modes:
- agent
- human
required_artifacts:
- evidence/04-install-and-smoke.md
status: pending
priority: high
unlocks:
- rollout-decision
