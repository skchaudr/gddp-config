schema_version: "1.0"
schema_type: node
node_id: repo-vetting
title: Vet all candidate dsh plugin repos from source and web
type: capability
why: |
  Eight third-party candidates (dsh-pi, dib, dsh-ha-orchestrator,
  awesome-deepseek-harness, ouroboros dsh-plugin, poison-guard,
  plugin-doctor, plugin-check, api-relay-audit, marketplace) are unverified.
  Nothing installs until each is vetted from source: existence, identity,
  activity, license, install mechanism, and red flags.
depends_on: []
acceptance_criteria:
  - id: vetting-table
    criterion: A vetting table exists (evidence file) with one row per candidate:
      verdict VETTED-OK / WATCH / REJECT, one-line rationale, trust signals,
      install mechanism, and any red flags found in source skim.
  - id: source-grounded
    criterion: Every verdict cites source-level evidence (repo read, code skim,
      README, package manifest) — not reputation or vibes.
  - id: dsh-pi-deep
    criterion: dsh-pi gets a dedicated analysis section: what it does, whether it
      is a genuine dsh↔Pi integration, its install surface, and its red flags.
constraints:
  - Read-only research; no installs, no repo mutations on sab-air.
allowed_execution_modes:
  - pi
  - human
required_artifacts:
  - evidence/01-repo-vetting.md
status: planned
priority: high
unlocks:
  - threat-model-protocol
