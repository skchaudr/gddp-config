title: Safe future plugin adoption runbook
type: capability
why: "The graph's durable output: a one-page runbook so future dsh plugin\nadoption follows the same safe path (vet \u2192\
  \ scan \u2192 isolate \u2192 smoke \u2192\nhuman) without re-deriving the protocol.\n"
depends_on:
- rollout-decision
acceptance_criteria:
- criterion: "A runbook doc distills the protocol into a repeatable procedure with exact commands, the isolation rule, and\
    \ the human gate \u2014 usable by a fresh agent session."
  id: runbook
- criterion: The runbook references the vetting table + marketplace/awesome-list as the working registry, and records any
    vetting results contributed back.
  id: registry
- criterion: Lessons from this adoption (what the scan chain caught, what surprised) are recorded for future runs.
  id: lessons
constraints:
- "Documentation only \u2014 no installs or config changes."
