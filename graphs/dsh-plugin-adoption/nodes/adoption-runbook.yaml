schema_version: "1.0"
schema_type: node
node_id: adoption-runbook
title: Safe future plugin adoption runbook
type: capability
why: |
  The graph's durable output: a one-page runbook so future dsh plugin
  adoption follows the same safe path (vet → scan → isolate → smoke →
  human) without re-deriving the protocol.
depends_on:
  - rollout-decision
acceptance_criteria:
  - id: runbook
    criterion: A runbook doc distills the protocol into a repeatable procedure
      with exact commands, the isolation rule, and the human gate — usable by a
      fresh agent session.
  - id: registry
    criterion: The runbook references the vetting table + marketplace/awesome-list
      as the working registry, and records any vetting results contributed back.
  - id: lessons
    criterion: Lessons from this adoption (what the scan chain caught, what
      surprised) are recorded for future runs.
constraints:
  - Documentation only — no installs or config changes.
allowed_execution_modes:
  - pi
  - human
required_artifacts:
  - evidence/07-adoption-runbook.md
status: planned
priority: medium
unlocks: []
