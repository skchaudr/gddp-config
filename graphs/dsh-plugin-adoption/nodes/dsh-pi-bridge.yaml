schema_version: '1.0'
schema_type: node
node_id: dsh-pi-bridge
title: Deep-dive dsh-pi — vet, implement, test in isolation
type: capability
why: 'dsh-pi (TGYD-helige/dsh-pi) is the candidate that may bridge dsh (sab-air)

  and Pi — potentially settling the daily-driver split. It gets the deepest

  vetting of the set: source read, capability map, install surface, and an

  isolated implementation test of its core integration.

  '
depends_on:
- isolated-test-profile
acceptance_criteria:
- id: analysis
  criterion: 'A dsh-pi analysis doc: what the plugin actually does (source-cited),
    its dsh↔Pi integration mechanism, its install surface, and its red flags (if any).'
- id: isolated-test
  criterion: dsh-pi installs in the isolated profile and its core integration path
    is exercised in a smoke test, with evidence (commands + outputs).
- id: split-feedback
  criterion: Findings are summarized for the daily-driver split decision (what the
    bridge enables, what it costs, trust verdict).
constraints:
- Isolated profile only; no live ~/.dsh; no Pi session mutations on sab-mini.
allowed_execution_modes:
- agent
- human
required_artifacts:
- evidence/05-dsh-pi-bridge.md
status: pending
priority: high
unlocks:
- rollout-decision
