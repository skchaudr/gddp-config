node_id: isolated-test-profile
title: Disposable empty macOS user profile on sab-air for plugin installs
type: capability
why: "The protocol's isolation requirement: a fresh macOS user profile with no\n~/.dsh credentials, no sessions, no API keys,\
  \ disposable after testing.\nAll plugin installs and smoke tests happen here \u2014 never in the live\nprofile.\n"
depends_on:
- threat-model-protocol
acceptance_criteria:
- criterion: An empty test user profile exists on sab-air (or an equivalent sandbox, cited), with node + npm available and
    NO dsh credentials or session state.
  id: profile
- criterion: "Verified that the test profile has no access to the live ~/.dsh credentials (env vars, credentials file, providers)\
    \ \u2014 evidence cites the check."
  id: no-leak
- criterion: The teardown path is documented (delete profile / restore), and the profile is re-creatable in one command.
  id: disposable
constraints:
- "Profile creation only \u2014 no plugin installs in this node (node 04)."
allowed_execution_modes:
- agent
- human
required_artifacts:
- evidence/03-isolated-test-profile.md
status: pending
priority: high
unlocks:
- install-and-smoke
- dsh-pi-bridge
